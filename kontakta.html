<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hitta till Nordic Escape Hotel och se vår adress på kartan.">
    <title>Kontakt - Nordic Escape Hotel</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>

        <h1>Nordic Escape Hotel</h1>

        <nav>
            <a href="index.html">Hem</a>
            <a href="boka.html">Boka</a>
            <a href="hitta.html">Hitta</a>
            <a href="kontakta.html">Kontakt</a>
        </nav>

    </header>

    <main>

        <section class="contact">

            <h2>Kontakta oss</h2>

            <p>Har du frågor eller vill veta mer? Kontakta oss gärna!</p>

            <div class="contact-info">

                <p><strong>Telefon:</strong> +46 13-123456</p>

                <p><strong>E-post:</strong> info@nordicescape.se</p>

                <p><strong>Adress:</strong> Vasaplan 7, 111 20 Stockholm</p>

            </div>

            <form>

                <label for="name">Namn</label>
                <input type="text" id="name" required>

                <label for="email">E-post</label>
                <input type="email" id="email" required>

                <label for="message">Meddelande</label>
                <textarea id="message" rows="6" required></textarea>

                <button type="submit">Skicka</button>

            </form>

        </section>

    </main>

    <footer>

        <p>Telefon: +46 13-123456</p>
        <p>E-post: info@nordicescape.se</p>
        <p>Adress: Vasaplan 7, 111 20 Stockholm</p>

    </footer>

</body>

</html>
